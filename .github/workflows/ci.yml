name: Alpha checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: ruff check alpha_core
      - run: mypy
      - name: Build required synthetic model fixtures
        run: |
          python -m tools.customer-churn-prediction.scripts.generate_data
          python -m tools.customer-churn-prediction.scripts.train
          python -m tools.customer-sentiment-intelligence.scripts.generate_data
          python -m tools.customer-sentiment-intelligence.scripts.train
      - run: python -m pytest -q
