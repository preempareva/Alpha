name: Alpha checks

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHON_DOTENV_DISABLED: "1"
  LLM_PROVIDER: none

jobs:
  linux:
    name: Linux / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.lock
      - name: Check dependency consistency
        run: python -m pip check
      - name: Lint scoped maintained code
        run: >-
          ruff check alpha_core alpha_app/main.py alpha_app/agent_hub.py
          scripts/check_eval_thresholds.py scripts/seed_all.py
          tests/conftest.py tests/test_alpha_core.py tests/test_business_data_copilot.py
          tools/enterprise-knowledge-assistant/tests/test_assistant.py
          tools/ai-it-helpdesk-assistant/tests/test_helpdesk.py
          tools/ai-sales-nudge-agent/tests/test_nudge.py
          tools/multi-agent-business-intelligence/app
          tools/business-data-copilot/app
          tools/inventory-optimization-agent/app/main.py
          tools/inventory-optimization-agent/app/tower_data.py
          tools/inventory-optimization-agent/app/tower_forecast.py
          tools/inventory-optimization-agent/app/tower_logic.py
          tools/inventory-optimization-agent/scripts/generate_tower_data.py
          tools/inventory-optimization-agent/scripts/evaluate_inventory.py
      - name: Type check shared runtime
        run: python -m mypy
      - name: Type check BI workflow
        working-directory: tools/multi-agent-business-intelligence
        env:
          MYPYPATH: ${{ github.workspace }}:${{ github.workspace }}/tools/multi-agent-business-intelligence
        run: python -m mypy
      - name: Type check Business Data Copilot
        working-directory: tools/business-data-copilot
        env:
          MYPYPATH: ${{ github.workspace }}:${{ github.workspace }}/tools/business-data-copilot
        run: python -m mypy
      - name: Type check Inventory Control Tower
        working-directory: tools/inventory-optimization-agent
        env:
          MYPYPATH: ${{ github.workspace }}:${{ github.workspace }}/tools/inventory-optimization-agent
        run: python -m mypy
      - name: Rebuild ignored synthetic demo assets
        run: python -m scripts.seed_all
      - name: Evaluate Knowledge Assistant retrieval
        run: python -m tools.enterprise-knowledge-assistant.scripts.evaluate
      - name: Evaluate BI Analyst Workflow
        run: python -m tools.multi-agent-business-intelligence.scripts.evaluate_agent
      - name: Evaluate Business Data Copilot
        run: python -m tools.business-data-copilot.scripts.eval_copilot
      - name: Evaluate Agent Hub
        run: python -m scripts.evaluate_agent_hub
      - name: Evaluate Inventory Control Tower
        run: python -m tools.inventory-optimization-agent.scripts.evaluate_inventory
      - name: Check evaluation thresholds
        run: python -m scripts.check_eval_thresholds
      - name: Run complete test suite
        run: python -m pytest -q
      - name: Check tracked JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(git ls-files '*.js')
      - name: Upload aggregate evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-evaluations-py${{ matrix.python-version }}
          path: |
            tools/enterprise-knowledge-assistant/data/evaluation/ci_report.json
            docs/eval/bi_agent.json
            docs/eval/copilot.json
            docs/eval/agent_hub.json
            docs/eval/inventory_forecast.json
          if-no-files-found: ignore
          retention-days: 14

  windows-fast:
    name: Windows / Python 3.12 fast tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.lock
      - name: Run auth and shell tests
        run: python -m pytest -q tests/test_auth.py tests/test_alpha_core.py
