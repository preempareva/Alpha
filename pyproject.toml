[project]
name = "project-alpha"
version = "0.1.0"
description = "A local workspace for thirteen focused AI and analytics tools."
requires-python = ">=3.12,<3.15"

[tool.pytest.ini_options]
testpaths = ["tests", "tools"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "--import-mode=importlib -ra"

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = [".venv", "**/data", "**/artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
files = ["alpha_core"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
