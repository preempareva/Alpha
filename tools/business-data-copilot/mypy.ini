[mypy]
python_version = 3.12
explicit_package_bases = True
warn_unused_configs = True
disallow_untyped_defs = True
no_implicit_optional = True
ignore_missing_imports = True
files = app/demo.py, app/evaluation.py, app/ingest.py, app/main.py, app/models.py, app/planner.py, app/query.py, app/service.py, app/storage.py, scripts/eval_copilot.py, scripts/generate_demo.py
