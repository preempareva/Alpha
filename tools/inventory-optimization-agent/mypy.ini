[mypy]
python_version = 3.12
files = app/tower_data.py, app/tower_forecast.py, app/tower_logic.py, app/main.py, scripts/generate_tower_data.py, scripts/evaluate_inventory.py
warn_unused_configs = True
disallow_untyped_defs = True
no_implicit_optional = True
ignore_missing_imports = True
follow_imports = skip
explicit_package_bases = True
